apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mcp-server
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aleemahmad0508/mcp-project.git
    targetRevision: master
    path: mcp-k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true