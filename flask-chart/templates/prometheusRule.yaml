apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: flask-alert-rules
  namespace: monitoring
  labels:
    release: prometheus


spec:
  groups:
  - name: flask.rules

    rules:

    - alert: FlaskPodsDown
      expr: up{job="flask"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Flask application is down"
        description: "Prometheus cannot scrape one or more Flask pods."

    - alert: HighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{namespace="flask",container="flask"}[5m]) > 0.5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "CPU usage is above 50%."

    - alert: HighMemoryUsage
      expr: container_memory_working_set_bytes{namespace="flask",container="flask"} > 500000000
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High Memory Usage"
        description: "Memory usage exceeded 500MB."

    - alert: PodRestarting
      expr: increase(kube_pod_container_status_restarts_total{namespace="flask"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Container Restarting"
        description: "A Flask pod restarted."

    - alert: TooManyRequests
      expr: rate(flask_http_request_total[1m]) > 100
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High Request Rate"
        description: "Flask is receiving too many requests."