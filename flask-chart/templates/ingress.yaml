apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: flask
  namespace: flask

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:

  - host: {{ .Values.ingress.host }}

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: flask

            port:

              number: {{ .Values.service.port }}